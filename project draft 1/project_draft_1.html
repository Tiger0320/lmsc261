<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);


    // --------------------------------
    // Coordinate system: 10 x 10
    // --------------------------------

    const X = n => w * (n / 10);
    const Y = n => h * (n / 10);


    // --------------------------------
    // Key coordinates
    // --------------------------------

    const rearX = X(1);
    const frontX = X(9);

    const wheelY = Y(7);

    const leftWheelX = X(3);
    const rightWheelX = X(7);

    const wheelRadius = w * 0.09;


    // --------------------------------
    // Background
    // --------------------------------

    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);


    // --------------------------------
    // Car body
    // --------------------------------

    ctx.beginPath();

    // Start at the back of the car
    ctx.moveTo(X(1), Y(6));

    // Back
    ctx.lineTo(X(2), Y(6));

    // Back windshield / roof
    ctx.quadraticCurveTo(
        X(2.5), Y(4.5),
        X(3), Y(4)
    );

    // Roof
    ctx.quadraticCurveTo(
        X(5), Y(3),
        X(7), Y(4)
    );

    // Front windshield
    ctx.quadraticCurveTo(
        X(7.5), Y(4.5),
        X(8), Y(5)
    );

    // Hood
    ctx.lineTo(X(9), Y(5));

    // Front
    ctx.lineTo(X(9), Y(6));

    // Bottom of car
    ctx.lineTo(X(8.5), Y(6));
    ctx.lineTo(X(8.5), Y(7));

    // Around right wheel
    ctx.lineTo(X(6.2), Y(7));

    // Bottom middle
    ctx.lineTo(X(3.8), Y(7));

    // Around left wheel
    ctx.lineTo(X(1.5), Y(7));

    ctx.lineTo(X(1.5), Y(6));

    ctx.closePath();

    ctx.fillStyle = "red";
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.stroke();


    // --------------------------------
    // Windows
    // --------------------------------

    ctx.beginPath();

    // Left window
    ctx.moveTo(X(3.2), Y(4.2));
    ctx.lineTo(X(4.8), Y(3.3));
    ctx.lineTo(X(4.8), Y(4.8));
    ctx.lineTo(X(3), Y(4.8));
    ctx.closePath();

    // Right window
    ctx.moveTo(X(5.2), Y(3.3));
    ctx.lineTo(X(6.8), Y(4.2));
    ctx.lineTo(X(7), Y(4.8));
    ctx.lineTo(X(5.2), Y(4.8));
    ctx.closePath();

    ctx.fillStyle = "white";
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();


    // --------------------------------
    // Left wheel
    // --------------------------------

    ctx.beginPath();

    ctx.arc(
        leftWheelX,
        wheelY,
        wheelRadius,
        0,
        Math.PI * 2,
        false
    );

    ctx.fillStyle = "black";
    ctx.fill();


    // Left wheel center
    ctx.beginPath();

    ctx.arc(
        leftWheelX,
        wheelY,
        w * 0.035,
        0,
        Math.PI * 2,
        false
    );

    ctx.fillStyle = "gray";
    ctx.fill();


    // --------------------------------
    // Right wheel
    // --------------------------------

    ctx.beginPath();

    ctx.arc(
        rightWheelX,
        wheelY,
        wheelRadius,
        0,
        Math.PI * 2,
        false
    );

    ctx.fillStyle = "black";
    ctx.fill();


    // Right wheel center
    ctx.beginPath();

    ctx.arc(
        rightWheelX,
        wheelY,
        w * 0.035,
        0,
        Math.PI * 2,
        false
    );

    ctx.fillStyle = "gray";
    ctx.fill();


    // --------------------------------
    // Headlight
    // --------------------------------

    ctx.beginPath();

    ctx.arc(
        X(8.7),
        Y(5.5),
        w * 0.025,
        0,
        Math.PI * 2,
        false
    );

    ctx.fillStyle = "yellow";
    ctx.fill();

    ctx.strokeStyle = "black";
    ctx.stroke();


    // --------------------------------
    // Door
    // --------------------------------

    ctx.beginPath();

    ctx.moveTo(X(5), Y(4.8));
    ctx.lineTo(X(5), Y(6.5));

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();


    // --------------------------------
    // Door handle
    // --------------------------------

    ctx.beginPath();

    ctx.moveTo(X(5.3), Y(5.2));
    ctx.lineTo(X(5.7), Y(5.2));

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

</script>
